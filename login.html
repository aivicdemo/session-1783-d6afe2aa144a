<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>献立くん - ログイン画面</title>
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg-main: #fef3e2;
      --bg-card: #fde8cc;
      --bg-sidebar: #fce4b6;
      --border: #f5d5a8;
      --text: #2d1810;
      --text-muted: #8b6f47;
      --top-bar-bg: #fde8cc;
      --top-bar-border: #f5d5a8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-card) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 48px 32px;
      border: 1px solid var(--border);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafaf8;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 24px;
    }

    .login-button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 24px;
      }

      .login-title {
        font-size: 20px;
      }

      .login-logo {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🍱</div>
        <h1 class="login-title" data-testid="login-title">献立くん</h1>
        <p class="login-subtitle">食費管理・最適化システム</p>
      </div>

      <form data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            data-testid="username"
            class="form-input"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            data-testid="password"
            class="form-input"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="login-button" data-testid="login-button">
          ログイン
        </button>
      </form>

      <div class="login-footer">
        ℹ️ サンプル実装では、どの入力内容でもログインできます。
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
