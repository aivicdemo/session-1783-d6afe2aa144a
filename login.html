<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>献立くん - ログイン画面</title>
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg-main: #fef3e2;
      --bg-card: #fde8cc;
      --bg-sidebar: #fce4b6;
      --border: #f5d5a8;
      --text: #2d1810;
      --text-muted: #8b6f47;
      --top-bar-bg: #fde8cc;
      --top-bar-border: #f5d5a8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-card) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(45, 24, 16, 0.08), 0 10px 20px rgba(45, 24, 16, 0.12);
      padding: 48px 32px;
      text-align: center;
    }

    .login-header {
      margin-bottom: 32px;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: #fafaf8;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(217, 119, 6, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-footer {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 24px;
      }

      .login-title {
        font-size: 20px;
      }

      .form-input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="app-icon">🍽️</div>
        <h1 class="login-title" data-testid="login-title">献立くん</h1>
        <p class="login-subtitle">食費管理・最適化システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            id="username"
            type="text"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            id="password"
            type="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
          >
        </div>

        <button class="login-button" type="submit" data-testid="login-button">
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p>※ サンプル実装ではどの入力でもログインできます</p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
