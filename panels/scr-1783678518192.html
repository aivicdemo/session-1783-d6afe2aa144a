* {

}

html, body {

body {

}

  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {

  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {

  height: 32px;

.user-name {

}

.container {

  flex: 1;
  overflow: hidden;
}

aside {

  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}

.nav-section {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.nav-section:first-child {
  padding-top: 8px;
}

.nav-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 16px 4px;
  letter-spacing: 0.5px;
}

.nav-item {
  display: block;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--text);
  text-decoration: none;

  transition: background 0.15s;
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: rgba(0,0,0,0.04);
}

.nav-item.aivic-active {
  background: rgba(217, 119, 6, 0.1);
  border-left-color: var(--primary);
  font-weight: 600;
}

main {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
}

[data-aivic-panel] {
  padding: 20px;
  min-height: 100%;
}

.page-header {
  margin-bottom: 24px;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.page-subtitle {
  font-size: 13px;
  color: var(--text-muted);
}

.action-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: rgba(0,0,0,0.04);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
}

.card-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.table-wrapper {
  overflow-x: auto;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 10px 12px;
  text-align: left;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}

td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tbody tr:hover {
  background: rgba(0,0,0,0.02);
}

.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  color: var(--text);
  background: white;
  font-family: inherit;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.1);
}

textarea {
  resize: vertical;
  min-height: 80px;
}

.rating-group {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.rating-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

.rating-btn:hover {
  border-color: var(--primary);
}

.rating-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.stepper {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}

.step {

  display: flex;
  align-items: center;
  position: relative;
}

.step-marker {

  height: 32px;
  border-radius: 50%;

  border: 2px solid var(--border);

  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.step.active .step-marker {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.step.completed .step-marker {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.step-line {
  flex: 1;
  height: 2px;
  background: var(--border);
  margin: 0 8px;
}

.step.completed .step-line {
  background: var(--primary);
}

.step-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: center;
}

.step.active .step-label {
  color: var(--text);
  font-weight: 600;
}

  grid-template-columns: 1fr 1fr;
  gap: 20px;
  min-height: 100%;

.split-left {
  overflow-y: auto;

.split-right {

  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.list-item {

  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;

.list-item:hover {

  border-color: var(--primary);

.list-item.active {

.list-item-title {

  font-weight: 600;

.list-item-meta {

  color: #dc2626;
}

.tag.success {

  color: #16a34a;
}

  border-radius: 4px;
  font-size: 13px;
  margin-bottom: 16px;
  border-left: 3px solid;
}

.alert-info {

  border-left-color: #3b82f6;
  color: #1e40af;
}

.alert-warning {

  border-left-color: #dc2626;
  color: #7f1d1d;
}

  z-index: 1000;
}

.modal-overlay.active {

  align-items: center;
  justify-content: center;
}

  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);

  width: 90%;

}

.modal-header {

  justify-content: space-between;

.modal-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.modal-close {

  font-size: 20px;

}

}

.nutrition-value {

  font-weight: 700;
  color: var(--primary);

.nutrition-unit {

.timeline-item {

  color: var(--text-muted);

.timeline-content {
  font-size: 13px;
  color: var(--text);
}

T13:45:22Z","更新日時":"2024-11-15T13:45:22Z"},{"食事評価ID":"rec-20250215-001","ユーザーID":"usr-00847","献立ID":"menu-seasonal-veg-2025-01","評価日":"2025-02-14T19:30:00+09:00","総合評価":5,"味の評価":5,"栄養バランス評価":5,"調理難易度評価":3,"コメント":"春キャベツと新玉ねぎを使った献立でしたが、素材の甘みが引き立っていて本当に美味しかったです。栄養バランスも完璧で、家族みんなが完食してくれました。調理も思ったより簡単で、また作りたいです。","再度提案希望":true,"作成日時":"2025-02-14T20:15:00+09:00","更新日時":"2025-02-14T20:15:00+09:00"},{"食事評価ID":"rec-001","ユーザーID":"usr-0847","献立ID":"menu-5632","評価日":"2024-11-15T12:30:00Z","総合評価":2,"味の評価":2,"栄養バランス評価":4,"調理難易度評価":2,"コメント":"カロリー制限食ということは理解していますが、毎回同じような鶏胸肉とブロッコリーの組み合わせで非常に単調です。味付けも薄く、食べていて飽きてしまいます。栄養バランスは取れているのだと思いますが、もう少し多様性のある献立を希望します。","再度提案希望":false,"作成日時":"2024-11-15T13:45:00Z","更新日時":"2024-11-15T13:45:00Z"},{"食事評価ID":"rec-001","ユーザーID":"user-0847","献立ID":"menu-0312","評価日":"2024-11-15T19:30:00Z","総合評価":3,"味の評価":4,"栄養バランス評価":4,"調理難易度評価":2,"コメント":"鶏肉の唐揚げと季節野菜のおひたしの献立でした。味は本当に美味しく、栄養バランスも考えられていて良かったです。ただ、下準備から調理完了まで1時間以上かかってしまい、平日の夜には少し時間がかかりすぎました。週末に作るには最適だと思います。","再度提案希望":false,"作成日時":"2024-11-16T08:45:00Z","更新日時":"2024-11-16T08:45:00Z"},{"食事評価ID":"rec-001","ユーザーID":"usr-0847","献立ID":"menu-2156","評価日":"2025-01-15T19:30:00+09:00","総合評価":5,"味の評価":5,"栄養バランス評価":4,"調理難易度評価":3,"コメント":"以前のフィードバックから和食を好むことを理解してくれたのか、今回の献立は本当に美味しかったです。鮭と大根おろしの組み合わせは最高でした。調理時間も30分程度で仕事帰りに作れたので助かります。","再度提案希望":true,"作成日時":"2025-01-15T20:15:00+09:00","更新日時":"2025-01-15T20:15:00+09:00"},{"食事評価ID":"rec-001","ユーザーID":"usr-0847","献立ID":"men-0512","評価日":"2024-11-15T18:30:00Z","総合評価":4,"味の評価":5,"栄養バランス評価":4,"調理難易度評価":3,"コメント":"味は家族全員で好評でした。ただ、同時に5品作るのは手際が必要で、最初は時間がかかってしまいました。2回目以降は要領を得ると思います。子どもたちも食べやすいサイズで良かったです。","再度提案希望":true,"作成日時":"2024-11-15T19:45:00Z","更新日時":"2024-11-15T19:45:00Z"},{"食事評価ID":"rec-001","ユーザーID":"usr-2847","献立ID":"men-5623","評価日":"2024-11-15T19:30:00Z","総合評価":5,"味の評価":5,"栄養バランス評価":5,"調理難易度評価":3,"コメント":"健康診断で血糖値が高めと指摘されたため、この献立を試してみました。塩分も控えめで、野菜がたっぷり入っており、とても満足しています。味も工夫されていて飽きません。毎日続けられそうです。","再度提案希望":true,"作成日時":"2024-11-15T20:45:00Z","更新日時":"2024-11-15T20:45:00Z"}],"アレ         var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
