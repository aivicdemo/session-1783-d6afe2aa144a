AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AIVIC Backend — 食費管理・最適化システム
  DynamoDB + Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  # ── DynamoDB テーブル ──────────────────────────────────────────

  DynamoDBTable0:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table0"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "0"
        - Key: TableName
          Value: "月次食費予算"

  DynamoDBTable1:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table1"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "1"
        - Key: TableName
          Value: "食費実績"

  DynamoDBTable2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "2"
        - Key: TableName
          Value: "購入記録"

  DynamoDBTable3:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table3"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "3"
        - Key: TableName
          Value: "食材"

  DynamoDBTable4:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table4"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "4"
        - Key: TableName
          Value: "流通業者"

  DynamoDBTable5:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table5"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "5"
        - Key: TableName
          Value: "スーパー"

  DynamoDBTable6:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table6"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "6"
        - Key: TableName
          Value: "在庫データ"

  DynamoDBTable7:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table7"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "7"
        - Key: TableName
          Value: "価格データ"

  DynamoDBTable8:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table8"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "8"
        - Key: TableName
          Value: "超過要因分析"

  DynamoDBTable9:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table9"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 食費管理・最適化システム
        - Key: TableIndex
          Value: "9"
        - Key: TableName
          Value: "削減効果分析"

  # ── Lambda 関数 ───────────────────────────────────────────────
  AivicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: lambda/
      Handler: handler.handler
      Description: "AIVIC CRUD API for 食費管理・最適化システム"
      Environment:
        Variables:
        AIVIC_TABLE_0: !Ref DynamoDBTable0
        AIVIC_TABLE_1: !Ref DynamoDBTable1
        AIVIC_TABLE_2: !Ref DynamoDBTable2
        AIVIC_TABLE_3: !Ref DynamoDBTable3
        AIVIC_TABLE_4: !Ref DynamoDBTable4
        AIVIC_TABLE_5: !Ref DynamoDBTable5
        AIVIC_TABLE_6: !Ref DynamoDBTable6
        AIVIC_TABLE_7: !Ref DynamoDBTable7
        AIVIC_TABLE_8: !Ref DynamoDBTable8
        AIVIC_TABLE_9: !Ref DynamoDBTable9
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
            - !GetAtt DynamoDBTable0.Arn
            - !GetAtt DynamoDBTable1.Arn
            - !GetAtt DynamoDBTable2.Arn
            - !GetAtt DynamoDBTable3.Arn
            - !GetAtt DynamoDBTable4.Arn
            - !GetAtt DynamoDBTable5.Arn
            - !GetAtt DynamoDBTable6.Arn
            - !GetAtt DynamoDBTable7.Arn
            - !GetAtt DynamoDBTable8.Arn
            - !GetAtt DynamoDBTable9.Arn
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}
            Method: ANY
        ApiItem:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}/{id}
            Method: ANY
        ApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{proxy+}
            Method: OPTIONS

  # ── API Gateway ───────────────────────────────────────────────
  AivicApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL (config.js に設定してください)"
    Value: !Sub "https://${AivicApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  Table0Name:
    Description: "DynamoDB table name for 月次食費予算"
    Value: !Ref DynamoDBTable0

  Table1Name:
    Description: "DynamoDB table name for 食費実績"
    Value: !Ref DynamoDBTable1

  Table2Name:
    Description: "DynamoDB table name for 購入記録"
    Value: !Ref DynamoDBTable2

  Table3Name:
    Description: "DynamoDB table name for 食材"
    Value: !Ref DynamoDBTable3

  Table4Name:
    Description: "DynamoDB table name for 流通業者"
    Value: !Ref DynamoDBTable4

  Table5Name:
    Description: "DynamoDB table name for スーパー"
    Value: !Ref DynamoDBTable5

  Table6Name:
    Description: "DynamoDB table name for 在庫データ"
    Value: !Ref DynamoDBTable6

  Table7Name:
    Description: "DynamoDB table name for 価格データ"
    Value: !Ref DynamoDBTable7

  Table8Name:
    Description: "DynamoDB table name for 超過要因分析"
    Value: !Ref DynamoDBTable8

  Table9Name:
    Description: "DynamoDB table name for 削減効果分析"
    Value: !Ref DynamoDBTable9
